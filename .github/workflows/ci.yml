name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch: a new push cancels the branch's older run.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: just build

  test:
    name: Test ${{ matrix.module }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      # A simulator the runner image ships with; xcodebuild boots it.
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17
    strategy:
      fail-fast: false
      matrix:
        # Every module with a test target (`<Module>/Tests` and a scheme in Project.swift).
        module: [Models, Networking]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: just test ${{ matrix.module }}

  # The check main requires. It passes only when every job above passed, so new jobs need no ruleset change.
  ci:
    name: CI
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "Build: $BUILD, Test: $TEST"
          [ "$BUILD" = success ] && [ "$TEST" = success ]
