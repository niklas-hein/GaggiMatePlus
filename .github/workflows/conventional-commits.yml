name: Conventional Commits

# The pull request title and every commit subject in the pull request follow Conventional Commits:
# "<type>: <description>" or "<type>(<scope>): <description>", with `!` before the colon for a breaking change.
# CLAUDE.md lists the types. GitHub's own `Revert "..."` titles and subjects pass too.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-conventional-commits.sh "$TITLE" "$BASE..$HEAD"
