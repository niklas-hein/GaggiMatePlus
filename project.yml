name: GaggiMatePlus
options:
  bundleIdPrefix: dev.niklashein
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  GaggiMateKit:
    path: Packages/GaggiMateKit
targets:
  GaggiMatePlus:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: GaggiMateKit
        products: [Transport, Models, Store]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GaggiMate+
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: GaggiMate+ connects to your GaggiMate controller on the local network.
        NSBonjourServices:
          - _gaggimate._tcp # placeholder
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.niklashein.gaggimateplus
        PRODUCT_NAME: GaggiMatePlus
        GENERATE_INFOPLIST_FILE: NO
schemes:
  GaggiMatePlus:
    build:
      targets:
        GaggiMatePlus: all
    test:
      targets:
        - package: GaggiMateKit/GaggiMateKitTests
